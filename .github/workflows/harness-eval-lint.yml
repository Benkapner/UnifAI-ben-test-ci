name: Lint agent configurations (harness-eval)

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - '.cursor/**'
      - '.coderabbit.yaml'
      - '.pr_agent.toml'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.github/harness-eval-baseline.json'
  workflow_dispatch:

jobs:
  harness-eval:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install harness-eval
        run: pip install -q harness-eval==6.1.1

      - name: Run lint
        run: |
          harness-eval lint . \
            --preset recommended \
            --baseline .github/harness-eval-baseline.json \
            --fail-on-error

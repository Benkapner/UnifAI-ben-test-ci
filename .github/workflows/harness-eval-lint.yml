name: Lint agent configurations (harness-eval)

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    paths:
      - '.cursor/**'
      - '.coderabbit.yaml'
      - '.pr_agent.toml'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.github/harness-eval-baseline.json'
  workflow_dispatch:

jobs:
  harness-eval:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install harness-eval
        run: pip install -q harness-eval==6.2.0

      - name: Run lint
        id: lint
        run: |
          set +e
          harness-eval lint . \
            --preset recommended \
            --baseline .github/harness-eval-baseline.json \
            --format json \
            --output harness-eval-results.json \
            --fail-on-error
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build comment and summary
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open("harness-eval-results.json") as f:
              r = json.load(f)

          insp = r.get("inspection", {})
          summary = insp.get("summary", {})
          total_errors = summary.get("errors", 0)
          total_warnings = summary.get("warnings", 0)
          status = "PASS" if total_errors == 0 else "FAIL"
          icon = "✅" if total_errors == 0 else "❌"

          lines = [
              f"## {icon} harness-eval lint: {status}",
              "",
              f"**Setup:** {r.get('setup', '?')} | **Detected:** {', '.join(r.get('detected_tools', []))} | "
              f"**Version:** {r['metadata']['version']}",
              "",
              "### Scanned components",
              "",
              "| Type | Count | Components |",
              "|------|-------|------------|",
          ]

          for comp_type in ["skill", "command", "hooks", "agent"]:
              items = insp.get(comp_type)
              if not items:
                  continue
              if isinstance(items, list):
                  names = [i.get("name", "?") for i in items]
                  lines.append(f"| {comp_type.title()}s | {len(items)} | {', '.join(names)} |")

          baseline_count = 0
          try:
              with open(".github/harness-eval-baseline.json") as bf:
                  baseline_count = len(json.load(bf).get("findings", []))
          except Exception:
              pass

          lines.extend([
              "",
              "### Results",
              "",
              f"**Rules checked:** {r['metadata']['rules_checked']} | "
              f"**Duration:** {r['metadata']['duration_seconds']:.1f}s | "
              f"**Baseline:** {baseline_count} findings suppressed",
              "",
          ])

          all_findings = []
          for comp_type in insp:
              if comp_type == "summary":
                  continue
              items = insp[comp_type]
              if not isinstance(items, list):
                  continue
              for item in items:
                  for f in item.get("findings", []):
                      all_findings.append({
                          "component": item.get("name", "?"),
                          "rule": f.get("rule", "unknown"),
                          "severity": f.get("severity", "info"),
                          "message": f.get("message", ""),
                      })

          if all_findings:
              lines.append("| Severity | Component | Rule | Message |")
              lines.append("|----------|-----------|------|---------|")
              for f in all_findings:
                  sev = f["severity"].upper()
                  marker = "❌" if sev == "ERROR" else "⚠️"
                  lines.append(f"| {marker} {sev} | `{f['component']}` | `{f['rule']}` | {f['message']} |")
          else:
              lines.append(f"> **No new issues found.** All {baseline_count} baselined findings suppressed.")

          system_findings = r.get("findings", [])
          if system_findings:
              lines.extend(["", "<details><summary>System-level notes</summary>", ""])
              for sf in system_findings:
                  lines.append(f"- {sf}")
              lines.extend(["", "</details>"])

          lines.extend([
              "",
              "---",
              f"<sub>harness-eval v{r['metadata']['version']} | "
              f"{r.get('component_count', '?')} components | "
              f"{r['metadata']['rules_checked']} rules</sub>",
          ])

          body = "\n".join(lines)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(body)

          with open("comment-body.md", "w") as f:
              f.write(body)
          PYEOF

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request' && steps.lint.outcome != 'skipped'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- harness-eval-lint -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Fail if errors
        if: always() && steps.lint.outputs.exit_code != '0'
        run: exit 1
